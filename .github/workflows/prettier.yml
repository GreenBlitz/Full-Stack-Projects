name: prettier.yml
on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Run Prettier Check
        run: npx prettier --check **/*.{ts,tsx,md}
